<nav class="navbar">
  <a routerLink="/" class="brand">Burros de Miranda</a>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
    @if (authService.currentUser()?.role === 'SPONSORED') {
      <a routerLink="/create-post" routerLinkActive="active">New Post</a>
    }
    @if (!authService.currentUser()) {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="btn btn-primary">Register</a>
    }
    @if (authService.currentUser()) {
      <span class="user-info">{{ authService.currentUser()?.email }}</span>
      <button (click)="logout()" class="btn btn-outline">Logout</button>
    }
  </div>
</nav>

<main>
  <router-outlet />
</main>
